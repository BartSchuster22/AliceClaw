services:
  frontend-web:
    build:
      context: .
      dockerfile: Dockerfile.base
    working_dir: /workspace/apps/frontend-web
    command: sh -c "pnpm dev"
    stdin_open: true
    tty: true
    ports:
      - "3000:5173"
    environment:
      CI: "true"
    volumes:
      - .:/workspace
      - frontend_web_node_modules:/workspace/node_modules
      - frontend_web_app_node_modules:/workspace/apps/frontend-web/node_modules
    depends_on:
      - backend-api

  frontend-app:
    build:
      context: .
      dockerfile: Dockerfile.base
    working_dir: /workspace/apps/frontend-app
    command: sh -c "pnpm dev"
    stdin_open: true
    tty: true
    ports:
      - "3001:5173"
    environment:
      CI: "true"
    volumes:
      - .:/workspace
      - frontend_app_node_modules:/workspace/node_modules
      - frontend_app_app_node_modules:/workspace/apps/frontend-app/node_modules
    depends_on:
      - backend-api

  frontend-admin:
    build:
      context: .
      dockerfile: Dockerfile.base
    working_dir: /workspace/apps/frontend-admin
    command: sh -c "pnpm dev"
    stdin_open: true
    tty: true
    ports:
      - "3002:5173"
    environment:
      CI: "true"
    volumes:
      - .:/workspace
      - frontend_admin_node_modules:/workspace/node_modules
      - frontend_admin_app_node_modules:/workspace/apps/frontend-admin/node_modules
    depends_on:
      - backend-api

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.base
    working_dir: /workspace/apps/backend-api
    command: sh -c "pnpm dev"
    stdin_open: true
    tty: true
    environment:
      CI: "true"
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://openclaw:dev_password@postgres:5432/openclaw
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
      - backend_api_node_modules:/workspace/node_modules
      - backend_api_app_node_modules:/workspace/apps/backend-api/node_modules
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.base
    working_dir: /workspace/apps/worker
    command: sh -c "pnpm dev"
    stdin_open: true
    tty: true
    environment:
      CI: "true"
      DATABASE_URL: postgres://openclaw:dev_password@postgres:5432/openclaw
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/workspace
      - worker_node_modules:/workspace/node_modules
      - worker_app_node_modules:/workspace/apps/worker/node_modules
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: openclaw
      POSTGRES_USER: openclaw
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  frontend_web_node_modules:
  frontend_web_app_node_modules:
  frontend_app_node_modules:
  frontend_app_app_node_modules:
  frontend_admin_node_modules:
  frontend_admin_app_node_modules:
  backend_api_node_modules:
  backend_api_app_node_modules:
  worker_node_modules:
  worker_app_node_modules:
  postgres_data:
