worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream frontend_web {
    server frontend-web:5173;
  }

  upstream frontend_app {
    server frontend-app:5173;
  }

  upstream frontend_admin {
    server frontend-admin:5173;
  }

  upstream backend_api {
    server backend-api:4000;
  }

  # Rate limiting zones
  # api: 30 requests per minute per IP
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  # auth: 10 requests per minute per IP
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  server {
    listen 80;
    server_name aquiero.com;

    location /api/auth/ {
      proxy_pass http://backend_api/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      limit_req zone=auth burst=10 nodelay;
    }

    location /api/ {
      proxy_pass http://backend_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      limit_req zone=api burst=20 nodelay;
    }

    location / {
      proxy_pass http://frontend_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name app.aquiero.com;

    location / {
      proxy_pass http://frontend_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name admin.aquiero.com;

    # IP restriction — replace with your actual admin IP or VPN range before production launch.
    allow 10.0.0.0/8;
    deny all;

    location / {
      proxy_pass http://frontend_admin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # TLS-ready deployment notes:
  # 1. Point DNS for the following hosts to the VPS:
  #    - aquiero.com
  #    - app.aquiero.com
  #    - admin.aquiero.com
  # 2. Obtain certificates, for example with Certbot:
  #    certbot --nginx -d aquiero.com -d app.aquiero.com -d admin.aquiero.com
  # 3. After issuance, add corresponding HTTPS server blocks with:
  #    - listen 443 ssl http2;
  #    - ssl_certificate /etc/letsencrypt/live/<domain>/fullchain.pem;
  #    - ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
  # 4. Redirect HTTP to HTTPS once certificates are installed.
  # 5. Keep the canonical API origin as:
  #    https://aquiero.com/api
}
